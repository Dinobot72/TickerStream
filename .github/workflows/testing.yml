name: TickerStream Tests
on:
  push:
    branches:
      - '**'  # Matches "api-overhaul", "test-branch", "feature/login", etc.
  pull_request:
    branches:
      - '**'
jobs:
  # ------------------------------------------------------------------
  # JOB 1: Frontend Tests
  # ------------------------------------------------------------------
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'yarn'
        cache-dependency-path: frontend/yarn.lock
        
    - name: Install Dependencies
      run: yarn install --frozen-lockfile
      
    - name: Run Angular Tests
      run: npx ng test --no-watch --code-coverage --browsers=ChromeHeadlessCI
      
    - name: Upload Frontend Coverage Report
      uses: actions/upload-artifact@v4
      if: always() # Upload even if tests fail so you can see what happened
      with:
        name: frontend-coverage-report
        path: frontend/coverage/frontend/
        retention-days: 14

  # ------------------------------------------------------------------
  # JOB 2: Backend Tests
  # ------------------------------------------------------------------
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Matches the local environment from previous logs
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt # Assumes you use requirements.txt

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run Pytest with Coverage
      # Generates a terminal summary (term-missing shows lines missing coverage) and an XML artifact
      run: pytest --cov=app --cov-report=term-missing --cov-report=xml

    - name: Upload Backend Coverage Report
      uses: actions/upload-artifact@v4
      if: always() 
      with:
        name: backend-coverage-report
        path: backend/coverage.xml
        retention-days: 14