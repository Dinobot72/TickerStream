name: TickerStream Tests

on:
  push:
    branches:
      - '**'  # Matches "api-overhaul", "test-branch", "feature/login", etc.
  pull_request:
    branches:
      - '**'

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Frontend Tests
  # ------------------------------------------------------------------
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: yarn install --frozen-lockfile

    - name: Run Angular Tests
      
      run: npx ng test --no-watch --code-coverage --browsers=ChromeHeadless

    - name: Upload Frontend Coverage Report
      uses: actions/upload-artifact@v4
      if: always() # Upload even if tests fail so you can see what happened
      with:
        name: frontend-coverage-report
        path: frontend/coverage/frontend/
        retention-days: 14
