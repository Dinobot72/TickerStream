<aside class="sidebar-container">
    <!-- Logo -->
    <div class="sidebar-logo-container">
        <svg class="sidebar-logo-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <!-- Icon for TickerStream -->
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
        </svg>
        <span class="text-xl font-bold text-gray-200">TickerStream</span>
    </div>


    <nav class="sidebar-nav">
        <ul class="sidebar-nav-list">
            @for (link of navLinks; track link.path) {
                <li>
                    <a [routerLink]="link.path" 
                        routerLinkActive="sidebar-nav-link-active" 
                        [routerLinkActiveOptions]="{ exact: link.exactMatch ?? false}"
                        class="sidebar-nav-link">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="link.iconSvgPath"></path>
                        </svg>
                        <span>{{ link.label }}</span>
                    </a>
                </li>
            }
        </ul>
    </nav>
</aside>
