server {
    listen 80;
    server_name _;

    # Docker's internal DNS resolver — required so nginx doesn't fail
    # at startup if a backend container isn't up yet.
    resolver 127.0.0.11 valid=30s;

    # ----------------------------------------------------------------
    # API — proxy to FastAPI backend
    # ----------------------------------------------------------------
    location /api/ {
        set $upstream_backend http://tickerstream-backend:8000;
        proxy_pass $upstream_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------
    # Everything else — proxy to the Angular SSR Node server
    # ----------------------------------------------------------------
    location / {
        set $upstream_frontend http://tickerstream-frontend:4000;
        proxy_pass $upstream_frontend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Angular SSR keep-alive / streaming
        proxy_set_header Connection        "";
    }
}