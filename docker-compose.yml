# -----------------------------------------------------------------------
# TickerStream AI — docker-compose.yml
#
# BEFORE RUNNING:
#   1. Copy .env.example to .env (gitignored) and fill in the values.
#   2. Never commit the real .env to version control.
# -----------------------------------------------------------------------

services:

  # ------------------------------------------------------------
  # nginx reverse proxy — public entry point
  # ------------------------------------------------------------
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - ticker-network

  # ------------------------------------------------------------
  # Cloudflare Tunnel — exposes nginx to the internet
  # Tunnel token is read from .env, NOT hardcoded here.
  # ------------------------------------------------------------
  tunnel:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - gateway
    networks:
      - ticker-network

  # ------------------------------------------------------------
  # FastAPI backend
  # ------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tickerstream-backend
    expose:
      - "8000"
    volumes:
      # Persistent SQLite data
      - bot_data:/app/data
      # Mount the AI model folder from the host into the container
      - ./model:/model
    environment:
      # --- Auth / Security ---
      - SECRET_KEY=${SECRET_KEY}

      # --- App mode ---
      # Must be "production" so Secure/SameSite=None cookies are set
      # correctly over HTTPS through the Cloudflare tunnel.
      - ENV=${ENV}

      # --- Database ---
      # Points inside the mounted volume, not the ephemeral container FS.
      # database.py currently hardcodes its path; see the note in the
      # README about updating it to read this variable.
      - DATABASE_PATH=/app/data/tickerstream.db

      # --- CORS ---
      # Replace with your actual public domain (no trailing slash).
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}

      # --- Bot ---
      - BOT_USER_ID=${BOT_USER_ID:-11}

      # --- Python path ---
      # Do NOT override PYTHONPATH here — let the Dockerfile's
      # ENV PYTHONPATH=/app stand so "backend.app.main" resolves.
      - PYTHONPATH=/app/backend

    networks:
      - ticker-network
    restart: always

  # ------------------------------------------------------------
  # Angular SSR frontend
  # ------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tickerstream-frontend
    expose:
      - "4000"
    depends_on:
      - backend
    networks:
      - ticker-network
    restart: always

# -----------------------------------------------------------------------
volumes:
  bot_data:

networks:
  ticker-network:
    name: ticker-network
    driver: bridge